# sync-wave 4: observability (OTel Collector, Prometheus, Alertmanager, Jaeger, Perses).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ontoaxis-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/component: observability
    ontoaxis.io/environment: kind
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ontoaxis
  sources:
    - repoURL: https://github.com/ontoaxis/ontoaxis.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ontoaxis/ontoaxis.git
      targetRevision: main
      path: deploy/helm/ontoaxis-observability
      helm:
        valueFiles:
          - $values/deploy/values/kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: oa-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
