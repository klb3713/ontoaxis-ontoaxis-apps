# sync-wave -5: ExternalSecret / ClusterSecretStore references, before workloads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ontoaxis-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/component: secrets
    ontoaxis.io/environment: kind
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ontoaxis
  source:
    repoURL: https://github.com/ontoaxis/ontoaxis.git
    targetRevision: main
    path: deploy/argocd/secrets/kind
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: oa-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
